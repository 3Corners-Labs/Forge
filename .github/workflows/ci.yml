name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test ./... -race -coverprofile=coverage.out
      - run: go build -trimpath -o dist/forge ./cmd/forge
      - uses: actions/upload-artifact@v7
        with:
          name: forge-linux-amd64
          path: dist/forge
