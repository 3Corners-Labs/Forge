name: M1 durable verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  durable-verification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge-dev-only
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FORGE_TEST_POSTGRES_DSN: postgres://forge:forge-dev-only@127.0.0.1:5432/forge?sslmode=disable
      FORGE_TEST_MINIO_ENDPOINT: 127.0.0.1:9000
      FORGE_M1_MINIO_ENDPOINT: 127.0.0.1:9000
      FORGE_M1_MINIO_ACCESS_KEY: minio
      FORGE_M1_MINIO_SECRET_KEY: minio-dev-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Verify embedded Workbench
        working-directory: internal/experience/workbench/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build
          git diff --exit-code -- ../dist
          pnpm run test:e2e
      - name: Start Developer Trial MinIO
        run: >-
          docker run --detach --rm --name forge-test-minio
          --publish 9000:9000
          --env MINIO_ROOT_USER=minio
          --env MINIO_ROOT_PASSWORD=minio-dev-only
          minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
      - name: Wait for MinIO
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          exit 1
      - name: Build immutable M1 worker and verifier images
        run: |
          mkdir -p dist/runtime/images/worker dist/runtime/images/verifier
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags "-s -w" -o dist/runtime/images/worker/forge-worker ./cmd/forge-worker
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags "-s -w" -o dist/runtime/images/verifier/forge-verifier ./cmd/forge-verifier
          docker build --iidfile dist/runtime/worker-image.id -f cmd/forge-worker/Dockerfile dist/runtime/images/worker
          docker build --iidfile dist/runtime/verifier-image.id -f cmd/forge-verifier/Dockerfile dist/runtime/images/verifier
          echo "FORGE_TEST_WORKER_IMAGE=$(cat dist/runtime/worker-image.id)" >> "$GITHUB_ENV"
          echo "FORGE_TEST_VERIFIER_IMAGE=$(cat dist/runtime/verifier-image.id)" >> "$GITHUB_ENV"
          echo "FORGE_TEST_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FORGE_TEST_OPERATIONAL_M1=1" >> "$GITHUB_ENV"
      - run: go test -race ./internal/delivery ./internal/evidence ./internal/execution ./internal/verification ./internal/experience ./internal/intent ./internal/identity ./internal/sourcecontrol ./internal/cli
