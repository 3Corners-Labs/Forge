name: Feature proposal
description: Propose a product or engineering capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem, not only the proposed solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Expected architecture impact
      options:
        - None
        - Existing ADR/RFC
        - New or updated ADR/RFC likely
        - Unknown
    validations:
      required: true
  - type: textarea
    id: trust
    attributes:
      label: Security, privacy, accessibility, and operational considerations
