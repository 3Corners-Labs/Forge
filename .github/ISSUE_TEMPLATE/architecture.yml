name: Architecture proposal
description: Start an RFC or architecture decision
title: "[Architecture]: "
labels: ["architecture"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context and problem
    validations:
      required: true
  - type: textarea
    id: drivers
    attributes:
      label: Quality attributes and constraints
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options to evaluate
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or PoC required
  - type: textarea
    id: consequences
    attributes:
      label: Expected consequences and reversibility
