name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Forge version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed secrets, tokens, certificates, and personal data.
          required: true
